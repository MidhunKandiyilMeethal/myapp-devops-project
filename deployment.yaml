apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      imagePullSecrets:
            - name: ecr-secret
      containers:
            - name: myapp
        image: 186067932771.dkr.ecr.us-east-1.amazonaws.com/myapp:latest
        ports:
                - containerPort: 80
        env:
                - name: DB_HOST
          value: mysql
                - name: DB_USER
          value: root
                - name: DB_PASSWORD
          value: password123
                - name: DB_NAME
          value: abc_tech
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  type: NodePort
  selector:
    app: myapp
  ports:
    - port: 80
    targetPort: 80
    nodePort: 30081
